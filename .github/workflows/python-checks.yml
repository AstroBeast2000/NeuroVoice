name: Python checks

on:
  push:
    branches: [main, "neurovoice/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy scikit-learn joblib
      - name: Compile application Python files
        run: python -m compileall -q app.py render_start.py src views
      - name: Run feature tests
        run: python -m unittest discover -s tests -v
